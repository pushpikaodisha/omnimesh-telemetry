<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E"/>
      <stop offset="100%" stop-color="#102038"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#48CAE4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">OMNIMESH TELEMETRY EDGE INGESTION &amp; AUTOMATION PIPELINE</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Virtual Sensors → PHP 8.3 MVC Ingestion → SQLite Time-Series → Rule Evaluator → SSE Stream</text>

  <!-- Step 1: Virtual Edge Sensors -->
  <g transform="translate(50, 95)">
    <rect width="200" height="250" rx="10" fill="#102038" stroke="#48CAE4" stroke-width="1.5"/>
    <text x="100" y="30" fill="#48CAE4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">VIRTUAL SENSORS</text>
    
    <rect x="15" y="55" width="170" height="36" rx="6" fill="#193356"/>
    <text x="25" y="77" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">🌡️ Temp (Sine Wave)</text>

    <rect x="15" y="100" width="170" height="36" rx="6" fill="#193356"/>
    <text x="25" y="122" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">🔘 Pressure (Stochastic)</text>

    <rect x="15" y="145" width="170" height="36" rx="6" fill="#193356"/>
    <text x="25" y="167" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">☢️ Radiation Meter</text>

    <rect x="15" y="190" width="170" height="36" rx="6" fill="#193356"/>
    <text x="25" y="212" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">📳 Vibration Accel</text>
  </g>

  <path d="M 260 220 L 300 220" stroke="#48CAE4" stroke-width="2.5"/>
  <polygon points="305,220 295,215 295,225" fill="#48CAE4"/>

  <!-- Step 2: PHP 8.3 MVC Backend -->
  <g transform="translate(310, 95)">
    <rect width="230" height="250" rx="10" fill="#102038" stroke="#0077B6" stroke-width="1.5"/>
    <text x="115" y="30" fill="#0077B6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PHP 8.3 MVC ENGINE</text>
    <rect x="15" y="55" width="200" height="36" rx="6" fill="#193356"/>
    <text x="115" y="77" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">Router.php (Regex)</text>
    <rect x="15" y="100" width="200" height="36" rx="6" fill="#193356"/>
    <text x="115" y="122" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">TelemetryController</text>
    <rect x="15" y="145" width="200" height="36" rx="6" fill="#193356"/>
    <text x="115" y="167" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">SimulationService</text>
    <rect x="15" y="190" width="200" height="36" rx="6" fill="#193356"/>
    <text x="115" y="212" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">Database.php (PDO)</text>
  </g>

  <path d="M 550 220 L 590 220" stroke="#0077B6" stroke-width="2.5"/>
  <polygon points="595,220 585,215 585,225" fill="#0077B6"/>

  <!-- Step 3: SQLite & Rule Evaluator -->
  <g transform="translate(600, 95)">
    <rect width="220" height="250" rx="10" fill="#102038" stroke="#0096C7" stroke-width="1.5"/>
    <text x="110" y="30" fill="#0096C7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SQLITE &amp; RULE ENGINE</text>
    
    <rect x="15" y="55" width="190" height="60" rx="6" fill="#193356"/>
    <text x="110" y="80" fill="#48CAE4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Time-Series Table</text>
    <text x="110" y="100" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">telemetry_logs (val, ts)</text>

    <rect x="15" y="130" width="190" height="95" rx="6" fill="#193356"/>
    <text x="110" y="155" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Rule Trigger Evaluation:</text>
    <text x="110" y="175" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">IF Temp &gt; 85°C</text>
    <text x="110" y="195" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">THEN Trigger Coolant Fan</text>
  </g>

  <path d="M 830 220 L 870 220" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="875,220 865,215 865,225" fill="#10B981"/>

  <!-- Step 4: Server-Sent Events UI -->
  <g transform="translate(880, 95)">
    <rect width="170" height="250" rx="10" fill="#102038" stroke="#10B981" stroke-width="2"/>
    <text x="85" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SSE CLIENT</text>
    <rect x="15" y="55" width="140" height="40" rx="6" fill="#193356"/>
    <text x="85" y="80" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Live SSE Stream</text>
    <rect x="15" y="105" width="140" height="40" rx="6" fill="#193356"/>
    <text x="85" y="130" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Canvas Gauges</text>
    <rect x="15" y="155" width="140" height="40" rx="6" fill="#193356"/>
    <text x="85" y="180" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Real-Time Charts</text>
  </g>

  <g transform="translate(50, 365)">
    <rect width="1000" height="85" rx="8" fill="#0C1729" stroke="#193356"/>
    <text x="30" y="30" fill="#48CAE4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📡 EDGE-NATIVE IOT TELEMETRY &amp; AUTOMATION ARCHITECTURE:</text>
    <text x="30" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Simulates distributed IoT devices streaming high-frequency sensor readings via HTTP POST into SQLite.</text>
    <text x="30" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">The backend evaluates automation thresholds and pushes event payloads over persistent Server-Sent Events (SSE) connections.</text>
  </g>
</svg>